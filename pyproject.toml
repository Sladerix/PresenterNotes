[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "presenternotes"
version = "0.1.2"
description = "Genera note presentatore in italiano da un PDF di slide con un LLM a scelta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf", "litellm", "tenacity", "pillow", "tqdm"]

[project.scripts]
presenternotes = "presenternotes:main"

[tool.setuptools]
py-modules = ["presenternotes"]
